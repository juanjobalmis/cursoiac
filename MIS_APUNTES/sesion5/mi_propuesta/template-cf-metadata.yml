AWSTemplateFormatVersion: '2010-09-09'
Description: 'Despliegue de entorno DAM: EC2 con Tomcat 11 (HTTPS), Java 25, MySQL Server, Elastic IP y despliegue continuo desde S3.'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC público donde se realizará el despliegue.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subred pública dentro del VPC seleccionado.
  AllowedIP:
    Type: String
    Description: Dirección IP pública permitida para conexiones SSH (22) y MySQL (3306). Formato CIDR (ej. 198.51.100.0/24 o tu-ip/32).
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    ConstraintDescription: "Debe ser una dirección CIDR válida, ej. 203.0.113.10/32"
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    Description: AMI ID de Amazon Linux 2023.
  InstanceType:
    Type: String
    Default: t3.medium
    Description: Tipo de instancia EC2.
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Par de claves SSH para acceso a la máquina.
  DbUser:
    Type: String
    NoEcho: true
    Description: Usuario de la base de datos de la aplicación.
  DbPass:
    Type: String
    NoEcho: true
    Description: Contraseña de la base de datos de la aplicación.
  TomcatUser:
    Type: String
    NoEcho: true
    Description: Usuario administrador de Tomcat.
  TomcatPass:
    Type: String
    NoEcho: true
    Description: Contraseña del administrador de Tomcat.
  HmacShaKey:
    Type: String
    NoEcho: true
    Description: Clave secreta HMAC SHA.
  MysqlRootPass:
    Type: String
    NoEcho: true
    Description: Contraseña para el usuario root de MySQL.
  MysqlRemoteUser:
    Type: String
    Default: uremoto
    Description: Nombre del usuario para acceso remoto a MySQL.
  MysqlRemotePass:
    Type: String
    NoEcho: true
    Description: Contraseña para el usuario de acceso remoto a MySQL.

Resources:
  # ==========================================
  # SECRET MANAGER
  # ==========================================
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "AppSecrets-${AWS::StackName}"
      Description: "Credenciales centralizadas para base de datos y Tomcat"
      SecretString: !Sub '{"db_user":"${DbUser}","db_pass":"${DbPass}","tomcat_user":"${TomcatUser}","tomcat_pass":"${TomcatPass}","hmac_sha_key":"${HmacShaKey}","mysql_root_pass":"${MysqlRootPass}","mysql_remote_user":"${MysqlRemoteUser}","mysql_remote_pass":"${MysqlRemotePass}"}'

  # ==========================================
  # BUCKET S3 PARA DESPLIEGUE (app.war)
  # ==========================================
  AppDeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "dam-deploy-bucket-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # ==========================================
  # GRUPO DE SEGURIDAD
  # ==========================================
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Reglas para Tomcat (HTTPS), SSH y MySQL.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedIP
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Ref AllowedIP

  # ==========================================
  # ELASTIC IP
  # ==========================================
  AppEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref AppInstance
      AllocationId: !GetAtt AppEIP.AllocationId

  # ==========================================
  # IAM ROLE (PERFIL DE INSTANCIA)
  # ==========================================
  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - LabRole

  # ==========================================
  # INSTANCIA EC2 PRINCIPAL
  # ==========================================
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref AppInstanceProfile
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Actualización e instalación de dependencias base
          yum update -y
          yum install -y jq tar wget aws-cli mariadb105-server openssl cronie

          # ==============================================================================
          # 1. INSTALACIÓN DE AMAZON CORRETTO 25
          # ==============================================================================
          wget https://corretto.aws/downloads/latest/amazon-corretto-25-x64-linux-jdk.tar.gz -P /tmp/
          mkdir -p /usr/local/corretto-25
          tar -xzf /tmp/amazon-corretto-25-x64-linux-jdk.tar.gz -C /usr/local/corretto-25 --strip-components=1
          rm -f /tmp/amazon-corretto-25-x64-linux-jdk.tar.gz

          cat <<EOF > /etc/profile.d/java.sh
          export JAVA_HOME=/usr/local/corretto-25
          export PATH=/usr/local/corretto-25/bin:\$PATH
          EOF
          chmod 644 /etc/profile.d/java.sh
          source /etc/profile.d/java.sh

          # ==============================================================================
          # 2. INSTALACIÓN DE APACHE TOMCAT 11
          # ==============================================================================
          wget https://downloads.apache.org/tomcat/tomcat-11/v11.0.22/bin/apache-tomcat-11.0.22.tar.gz -P /tmp/
          mkdir -p /opt/tomcat
          tar -xzf /tmp/apache-tomcat-11.0.22.tar.gz -C /opt/tomcat --strip-components=1
          rm -f /tmp/apache-tomcat-11.0.22.tar.gz

          groupadd -r tomcat
          useradd -r -s /bin/false -g tomcat -d /opt/tomcat tomcat
          chown -R tomcat:tomcat /opt/tomcat
          sh -c 'chmod +x /opt/tomcat/bin/*.sh'

          # ==============================================================================
          # 3. CERTIFICADO SSL/TLS Y CONFIGURACIÓN TOMCAT (PUERTO 443)
          # ==============================================================================
          mkdir -p /opt/tomcat/conf/ssl
          PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4 || echo "localhost")
          
          openssl req -new -newkey rsa:2048 -days 365 -nodes -x509 \
            -subj "/C=ES/ST=Alicante/L=Alicante/O=IES Doctor Balmis/OU=DAM/CN=\$PUBLIC_IP" \
            -keyout /opt/tomcat/conf/ssl/tomcat.key -out /opt/tomcat/conf/ssl/tomcat.crt
          chown -R tomcat:tomcat /opt/tomcat/conf/ssl

          # Deshabilitar el puerto 8080 nativo e inyectar el conector SSL en 443
          sed -i '/<Connector port="8080"/,/\/>/d' /opt/tomcat/conf/server.xml
          sed -i '/<Service name="Catalina">/a \
              <Connector port="443" protocol="org.apache.coyote.http11.Http11NioProtocol" \
                         maxThreads="150" SSLEnabled="true" scheme="https" secure="true" \
                         clientAuth="false" sslProtocol="TLS"> \
                  <SSLHostConfig> \
                      <Certificate certificateFile="conf/ssl/tomcat.crt" \
                                   certificateKeyFile="conf/ssl/tomcat.key" \
                                   type="RSA" /> \
                  </SSLHostConfig> \
              </Connector>' /opt/tomcat/conf/server.xml

          # ==============================================================================
          # 4. INTEGRACIÓN DE SECRETOS (TOMCAT & MYSQL)
          # ==============================================================================
          SECRET_VAL=$(aws secretsmanager get-secret-value --secret-id "${AppSecrets}" --region "${AWS::Region}" --query SecretString --output text)
          DB_USER=$(echo "\$SECRET_VAL" | jq -r .db_user)
          DB_PASS=$(echo "\$SECRET_VAL" | jq -r .db_pass)
          TOMCAT_USER=$(echo "\$SECRET_VAL" | jq -r .tomcat_user)
          TOMCAT_PASS=$(echo "\$SECRET_VAL" | jq -r .tomcat_pass)
          HMAC_SHA_KEY=$(echo "\$SECRET_VAL" | jq -r .hmac_sha_key)
          MYSQL_ROOT_PASS=$(echo "\$SECRET_VAL" | jq -r .mysql_root_pass)
          MYSQL_REMOTE_USER=$(echo "\$SECRET_VAL" | jq -r .mysql_remote_user)
          MYSQL_REMOTE_PASS=$(echo "\$SECRET_VAL" | jq -r .mysql_remote_pass)

          cat <<EOF > /opt/tomcat/conf/tomcat-users.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <tomcat-users xmlns="http://tomcat.apache.org/xml" version="1.0">
              <role rolename="admin"/>
              <role rolename="admin-gui"/>
              <role rolename="manager"/>
              <role rolename="manager-gui"/>
            <user username="\$TOMCAT_USER" password="\$TOMCAT_PASS" roles="admin,admin-gui,manager,manager-gui"/>
          </tomcat-users>
          EOF
          chown tomcat:tomcat /opt/tomcat/conf/tomcat-users.xml
          chmod 644 /opt/tomcat/conf/tomcat-users.xml

          sed -i 's|allow="[^"]*"|allow=".*"|g' /opt/tomcat/webapps/manager/META-INF/context.xml
          sed -i 's|allow="[^"]*"|allow=".*"|g' /opt/tomcat/webapps/host-manager/META-INF/context.xml

          # ==============================================================================
          # 5. INSTALACIÓN Y CONFIGURACIÓN DE MYSQL SERVER
          # ==============================================================================
          systemctl enable mariadb
          systemctl start mariadb

          mysql -u root -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '\$MYSQL_ROOT_PASS'; FLUSH PRIVILEGES;" || \
          mysql -u root -e "SET PASSWORD FOR 'root'@'localhost' = PASSWORD('\$MYSQL_ROOT_PASS'); FLUSH PRIVILEGES;"

          mysql -u root -p"\$MYSQL_ROOT_PASS" -e "CREATE USER '\$MYSQL_REMOTE_USER'@'%' IDENTIFIED BY '\$MYSQL_REMOTE_PASS';"
          mysql -u root -p"\$MYSQL_ROOT_PASS" -e "GRANT ALL ON *.* TO '\$MYSQL_REMOTE_USER'@'%'; FLUSH PRIVILEGES;"

          if grep -q "bind-address" /etc/my.cnf.d/mariadb-server.cnf 2>/dev/null; then
              sed -i 's/^.*bind-address.*/bind-address = 0.0.0.0/' /etc/my.cnf.d/mariadb-server.cnf
          else
              echo -e "\n[mysqld]\nbind-address = 0.0.0.0" >> /etc/my.cnf
          fi
          systemctl restart mariadb

          # ==============================================================================
          # 6. UNIDAD DE SERVICIO SYSTEMD DE TOMCAT
          # ==============================================================================
          cat <<EOF > /etc/systemd/system/tomcat.service
          [Unit]
          Description=Apache Tomcat 11 Web Application Container
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=forking
          User=tomcat
          Group=tomcat
          RestartSec=10
          Restart=always

          Environment="JAVA_HOME=/usr/local/corretto-25"
          Environment="PATH=/usr/local/corretto-25/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
          Environment="CATALINA_HOME=/opt/tomcat"
          Environment="CATALINA_BASE=/opt/tomcat"
          Environment="CATALINA_PID=/opt/tomcat/temp/tomcat.pid"
          Environment="JAVA_OPTS=-Djava.awt.headless=true -Djava.security.egd=file:/dev/./urandom"
          Environment="CATALINA_OPTS=-Xms512M -Xmx1024M -server -XX:+UseParallelGC"

          Environment="HMAC_SHA_KEY=\$HMAC_SHA_KEY"
          Environment="DB_HOST=localhost"
          Environment="DB_USER=\$DB_USER"
          Environment="DB_PASS=\$DB_PASS"

          ExecStart=/opt/tomcat/bin/startup.sh
          ExecStop=/opt/tomcat/bin/shutdown.sh

          [Install]
          WantedBy=multi-user.target
          EOF

          chmod 644 /etc/systemd/system/tomcat.service
          systemctl daemon-reload
          systemctl enable tomcat
          systemctl start tomcat

          # ==============================================================================
          # 7. AGENTE DE DESPLIEGUE CONTINUO DESDE S3 (CRON)
          # ==============================================================================
          cat <<'EOF' > /usr/local/bin/deploy-war.sh
          #!/bin/bash
          BUCKET=$1
          S3_FILE="s3://$BUCKET/app.war"
          LOCAL_WAR="/opt/tomcat/webapps/ROOT.war"

          # Si el fichero existe en S3, lo tratamos
          if aws s3 ls "$S3_FILE" > /dev/null 2>&1; then
              aws s3 cp "$S3_FILE" /tmp/ROOT.war --quiet
              
              # Solo sobrescribimos si el archivo es diferente (evita reiniciar la app en bucle)
              if [ -f "$LOCAL_WAR" ]; then
                  LOCAL_MD5=$(md5sum "$LOCAL_WAR" | awk '{ print $1 }')
                  REMOTE_MD5=$(md5sum /tmp/ROOT.war | awk '{ print $1 }')
                  if [ "$LOCAL_MD5" == "$REMOTE_MD5" ]; then
                      rm -f /tmp/ROOT.war
                      exit 0
                  fi
              fi
              
              # Desplegar la nueva versión
              mv /tmp/ROOT.war "$LOCAL_WAR"
              chown tomcat:tomcat "$LOCAL_WAR"
          fi
          EOF
          
          chmod +x /usr/local/bin/deploy-war.sh
          systemctl enable crond
          systemctl start crond
          echo "*/5 * * * * root /usr/local/bin/deploy-war.sh ${AppDeploymentBucket}" >> /etc/crontab

Outputs:
  PublicIpAddress:
    Description: Dirección IP Elástica (EIP) asociada a la instancia
    Value: !GetAtt AppEIP.PublicIp
  TomcatURL:
    Description: URL de acceso seguro a la aplicación
    Value: !Sub "https://${AppEIP.PublicIp}"
  DeploymentBucketName:
    Description: Nombre del bucket S3 donde subir el archivo app.war
    Value: !Ref AppDeploymentBucket